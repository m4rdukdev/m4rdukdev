# Salvar em: .github/workflows/snake.yml (no repo SEU_USUARIO/SEU_USUARIO)
name: Snake

on:
  schedule:
    - cron: "0 3 * * *"   # todo dia
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#00FF41&color_dots=#0D1117,#003B10,#00802A,#00C032,#00FF41

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}